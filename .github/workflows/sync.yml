name: Sync Sales Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pymssql cryptography

      - name: Run sync
        env:
          DB_SERVER:   ${{ secrets.DB_SERVER }}
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EXECUTOR_SECRET: ${{ secrets.EXECUTOR_SECRET }}
        run: |
          python sync.py
          python sync_today.py

      - name: Fetch employee reports (divuchim)
        env:
          DIVUACH_EXPORT_KEY: ${{ secrets.DIVUACH_EXPORT_KEY }}
        run: |
          if curl -sf "https://divuchim.chasidim-center.co.il/api/export?key=$DIVUACH_EXPORT_KEY" -o docs/staff_reports.json.tmp \
             && python -c "import json; json.load(open('docs/staff_reports.json.tmp'))"; then
            mv docs/staff_reports.json.tmp docs/staff_reports.json
          else
            echo "fetch failed — keeping previous"; rm -f docs/staff_reports.json.tmp
          fi

      - name: Encrypt data files
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python encrypt_data.py

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add docs/*.enc
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "Auto-sync $(date +'%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin master && git push && exit 0
            sleep 3
          done
          exit 1
