name: Sync Sales Data

on:
  schedule:
    - cron: '*/5 * * * *'  # כל 5 דקות
  workflow_dispatch:        # כפתור הפעלה ידנית

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pymssql

      - name: Run sync
        env:
          DB_SERVER:   ${{ secrets.DB_SERVER }}
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python sync.py
          python sync_today.py

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add docs/today.json docs/data.json docs/search.json docs/reports.json docs/users.json
          git diff --staged --quiet || git commit -m "Auto-sync $(date +'%d/%m/%Y %H:%M')"
          git pull --rebase origin master
          git push
